name: Emulator tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: |
          npm ci
          npm install -g firebase-tools
      - name: Run emulator tests
        run: |
          firebase emulators:exec --project resqfood-ec8f5 --only auth,firestore "node tests/qr-test.js && node tests/invite-test.js && node tests/assignRole-test.js"
