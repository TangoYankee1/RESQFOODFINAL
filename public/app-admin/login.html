<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResQFood - App Admin Login</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="offline-banner">📶 Offline ka ngayon. Kailangan ng koneksyon para mag-login.</div>
  <div class="reg-hero"><span class="brand-mark">🍱 RESQFOOD</span><h1>App Admin Login</h1><p>Restricted system administration area.</p></div>
  <main class="reg-container" style="max-width:480px; margin:0 auto;">
    <div class="step-title">Mag-sign in bilang App Admin</div>
    <div class="step-desc">Gamitin ang emulator account na ginawa ng local seed command.</div>
    <div class="form-group"><label class="form-label" for="admin-email">Username</label><input class="form-input" id="admin-email" type="text" autocomplete="username" placeholder="god1" /><div class="form-error" id="admin-email-error"></div></div>
    <div class="form-group"><label class="form-label" for="admin-password">Password</label><input class="form-input" id="admin-password" type="password" autocomplete="current-password" placeholder="admin 1" /><div class="form-error" id="admin-password-error"></div></div>
    <div class="form-error" id="admin-login-error"></div>
    <button class="btn btn-primary btn-full btn-lg" id="admin-login-button" type="button">Mag-sign in</button>
    <a class="btn btn-ghost btn-full" href="/index.html" style="margin-top:var(--sp-3);">← Bumalik</a>
  </main>
  <div id="toast-container" aria-live="polite"></div>
  <script type="module" src="../js/modules/appAdminLogin.js?v=app-admin-login-v1"></script>
</body>
</html>
